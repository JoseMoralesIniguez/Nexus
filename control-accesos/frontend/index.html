<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | Premium Access</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="text-center mb-4">
                    <i class="fas fa-shield-alt text-primary" style="font-size: 3rem; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5));"></i>
                    <h2 class="mt-3 fw-bold text-white tracking-wide">Nexus Access</h2>
                    <p class="text-muted">Portal de Seguridad Residencial</p>
                </div>

                <div class="glass-card p-4 p-md-5">
                    <form id="loginForm">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required value="residente@correo.com">
                            <label for="email"><i class="fas fa-envelope me-2"></i>Correo Electrónico</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" placeholder="Password" required value="12345">
                            <label for="password"><i class="fas fa-lock me-2"></i>Contraseña</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow">
                            Ingresar <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </form>
                    <div id="loginAlert" class="mt-3 text-danger text-center fw-semibold d-none"></div>
                </div>
                
                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 Nexus Systems.</small>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
