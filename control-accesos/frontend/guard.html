<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caseta | Nexus Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-dark glass-card border-0 border-bottom rounded-0 py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-warning" href="#"><i class="fas fa-video me-2"></i>Terminal Caseta #1</a>
            <div class="d-flex align-items-center">
                <span class="text-muted me-3">Oficial: <span id="guardName" class="text-white fw-bold">...</span></span>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger rounded-pill px-3"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="glass-card p-5 mt-3 shadow-lg position-relative overflow-hidden">
                    <!-- Escáner background anim -->
                    <div style="position: absolute; top:0; left: 0; width: 100%; height: 2px; background: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px var(--primary); animation: scanLine 2s infinite linear;"></div>

                    <h2 class="text-center fw-bold mb-4 text-white"><i class="fas fa-barcode me-3 text-primary"></i>Esperando Escaneo...</h2>
                    
                    <form id="scanForm">
                        <div class="mb-4">
                            <input type="text" class="form-control form-control-lg scanner-input py-3 rounded-pill bg-dark text-primary border-primary" id="scannerInput" placeholder="Enfoque la pistola aquí" autofocus autocomplete="off">
                            <div class="form-text text-center mt-3 text-muted">El sistema validará automáticamente al presionar Enter.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill d-none">Validar Manualmente</button>
                    </form>

                    <!-- Zona de resultados -->
                    <div id="scanResult"></div>
                </div>

            </div>
        </div>
    </div>

    <style>
        @keyframes scanLine {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
