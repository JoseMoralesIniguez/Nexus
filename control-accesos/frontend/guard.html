<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caseta | Nexus Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-dark glass-card border-0 border-bottom rounded-0 py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-warning" href="#"><i class="fas fa-video me-2"></i>Terminal Caseta #1</a>
            <div class="d-flex align-items-center">
                <span class="text-muted me-3">Oficial: <span id="guardName" class="text-white fw-bold">...</span></span>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger rounded-pill px-3"><i class="fas fa-power-off"></i></button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="glass-card p-5 mt-3 shadow-lg position-relative overflow-hidden">
                    <!-- Escáner background anim -->
                    <div style="position: absolute; top:0; left: 0; width: 100%; height: 2px; background: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px var(--primary); animation: scanLine 2s infinite linear;"></div>

                    <h2 class="text-center fw-bold mb-4 text-white"><i class="fas fa-shield-alt me-3 text-primary"></i>Punto de Control</h2>
                    
                    <div class="row mb-4">
                        <div class="col-6 pe-1">
                            <button class="btn btn-primary w-100 active fw-bold" id="btnModeGun"><i class="fas fa-barcode me-2"></i>Pistola USB</button>
                        </div>
                        <div class="col-6 ps-1">
                            <button class="btn btn-outline-info w-100 fw-bold" id="btnModeCam"><i class="fas fa-camera me-2"></i>Cámara Web</button>
                        </div>
                    </div>

                    <div id="gunModeArea">
                        <form id="scanForm">
                            <div class="mb-4">
                                <input type="text" class="form-control form-control-lg scanner-input py-3 rounded-pill bg-dark text-primary border-primary text-center fw-bold fs-4" id="scannerInput" placeholder="Enfoque aquí y dispare" autofocus autocomplete="off">
                                <div class="form-text text-center mt-3 text-muted">El sistema validará automáticamente al presionar Enter.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill d-none">Validar Manualmente</button>
                        </form>
                    </div>

                    <div id="camModeArea" class="d-none">
                        <div id="qr-reader" class="bg-dark rounded shadow-sm border border-2 border-info mb-2" style="width:100%; min-height: 250px;"></div>
                        <div class="form-text text-center text-muted">Muestre el código QR del visitante a la cámara.</div>
                    </div>

                    <!-- Zona de resultados -->
                    <div id="scanResult"></div>
                </div>

                <!-- Monitor de Visitas -->
                <div class="glass-card p-4 mt-4 shadow-lg">
                    <h4 class="fw-bold text-white mb-4"><i class="fas fa-desktop me-2 text-primary"></i>Monitor en Tiempo Real</h4>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0" style="background-color: transparent;">
                            <thead>
                                <tr class="text-muted small text-uppercase">
                                    <th class="border-secondary">Visitante</th>
                                    <th class="border-secondary">Destino</th>
                                    <th class="border-secondary">Estado</th>
                                    <th class="border-secondary text-end">Vigencia</th>
                                </tr>
                            </thead>
                            <tbody id="monitorTableBody">
                                <tr><td colspan="4" class="text-center text-muted py-4">Cargando monitor...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <style>
        @keyframes scanLine {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        /* Ajustes para el html5-qrcode para que combine con el tema oscuro */
        #qr-reader img { margin: auto; }
        #qr-reader button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-top: 10px; }
        #qr-reader a { color: #60a5fa; }
        /* Ocultar el mensaje rojo molesto de la librería cuando se escanea una imagen */
        #qr-reader span[style*="color: red"], 
        #qr-reader div[style*="color: red"],
        #qr-reader div[style*="rgba(255, 0, 0"],
        #qr-reader__dashboard_section_csr > div { display: none !important; }
        #qr-reader__dashboard_section_csr { display: block !important; } /* Mantener los botones visibles */
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
