<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Panel | Nexus Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-dark glass-card border-0 border-bottom rounded-0 py-3 mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#"><i class="fas fa-shield-alt me-2"></i>Nexus</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3 d-none d-md-block" id="userName">Cargando...</span>
                <button id="btnLogout" class="btn btn-sm btn-outline-light rounded-pill px-3"><i class="fas fa-sign-out-alt me-1"></i> Salir</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <!-- Columna Izquierda: Perfil y QR -->
            <div class="col-lg-4">
                <div class="glass-card p-4 text-center h-100">
                    <h4 class="fw-bold mb-4">Mi Pase de Acceso</h4>
                    <div id="qrCode" class="mb-4 d-flex justify-content-center">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                    <p class="text-muted mb-1"><i class="fas fa-map-marker-alt me-2"></i><span id="userAddress">Cargando dirección...</span></p>
                    <div class="mt-4 pt-3 border-top border-secondary">
                        <p class="mb-2 text-white-50 small text-uppercase tracking-wide">Estado Financiero</p>
                        <div id="paymentStatus"></div>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Visitas -->
            <div class="col-lg-8">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="fw-bold m-0">Mis Visitas</h3>
                    <button class="btn btn-primary rounded-pill px-4 shadow" data-bs-toggle="modal" data-bs-target="#createVisitModal">
                        <i class="fas fa-plus me-2"></i>Nuevo Pase
                    </button>
                </div>

                <div id="visitsList">
                    <div class="text-center py-5"><div class="spinner-grow text-primary" role="status"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear Visita -->
    <div class="modal fade" id="createVisitModal" tabindex="-1" data-bs-backdrop="static">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-white">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold"><i class="fas fa-calendar-plus text-primary me-2"></i>Generar Pase Temporal</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="createVisitForm">
              <div class="modal-body py-4">
                <div class="mb-3">
                    <label class="form-label text-muted">Nombre del Visitante / Proveedor</label>
                    <input type="text" class="form-control" id="visitorName" required placeholder="Ej. Uber Eats / Familia Pérez">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted">Válido Desde</label>
                        <input type="datetime-local" class="form-control" id="validFrom" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-muted">Válido Hasta</label>
                        <input type="datetime-local" class="form-control" id="validUntil" required>
                    </div>
                </div>
              </div>
              <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary rounded-pill px-4 shadow">Generar Código</button>
              </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
